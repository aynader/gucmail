name: Something isn't working
description: Report a bug in gucmail
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run gucmail\n2. Press ...\n3. See ..."
  - type: input
    id: version
    attributes:
      label: gucmail version
      description: Run `gucmail --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gucmail doctor`
      description: It hides your password and email address. Please check it before pasting anyway.
      render: text
