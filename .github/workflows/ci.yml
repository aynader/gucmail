name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests qa
      - name: Type check
        run: python -m mypy src
      - name: Core tests (offline guard; no network or credentials)
        run: >
          python qa/offline/run.py --fixture-credentials
          --private .ci/private --output .ci/output
          pytest -q tests/test_cli.py tests/test_cli_core_mail_output.py
          tests/test_foundations.py tests/test_documentation.py
          tests/test_package_artifacts.py tests/test_windows_identity.py
